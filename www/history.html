<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utkio — History</title>
<link rel="stylesheet" href="shared/style.css">
<style>
  .wrap{ overflow-y:auto; }
  .session-card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; margin-bottom:12px; cursor:pointer;
  }
  .session-top{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .session-date{ font-weight:700; font-size:0.92rem; }
  .session-meta{ font-size:0.76rem; color:var(--ink-dim); margin-top:2px; }
  .chevron{ transition:transform 0.15s; color:var(--ink-dim); flex-shrink:0; }
  .session-card.open .chevron{ transform:rotate(180deg); }
  .session-transcript{ display:none; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
  .session-card.open .session-transcript{ display:block; }
  .t-line{ font-size:0.86rem; line-height:1.5; margin-bottom:8px; }
  .t-line .t-tag{ font-weight:700; margin-right:6px; }
  .t-line.user .t-tag{ color:var(--accent); }
  .resume-btn{
    margin-top:12px; width:100%; padding:10px; border-radius:10px; border:1.5px solid var(--accent);
    background:transparent; color:var(--accent); font-weight:700; font-size:0.85rem; cursor:pointer;
  }
  .empty-state{ text-align:center; color:var(--ink-dim); padding:60px 20px; font-size:0.9rem; }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="icon-btn" href="chat.html" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </a>
    <h1 class="app-title" style="font-size:1.2rem;">History</h1>
    <span style="width:38px;"></span>
  </header>

  <div id="listMsg" class="status-msg" style="margin-top:16px;">Loading...</div>
  <div id="sessionList" style="margin-top:16px;"></div>
</div>

<script type="module">
import './shared/config.js';
import { requireAuthOrRedirect, apiFetch } from './shared/auth.js';

requireAuthOrRedirect();

const listMsg = document.getElementById('listMsg');
const sessionList = document.getElementById('sessionList');

function formatDuration(startedAt, endedAt){
  const ms = new Date(endedAt) - new Date(startedAt);
  const totalSec = Math.max(0, Math.round(ms / 1000));
  const min = Math.floor(totalSec / 60);
  const sec = totalSec % 60;
  return min > 0 ? `${min} min ${sec} sec` : `${sec} sec`;
}

function formatDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) +
    ' · ' + d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
}

async function loadTranscript(sessionId, container){
  container.innerHTML = '<div class="status-msg">Loading...</div>';
  try {
    const data = await apiFetch('/chat/sessions/' + sessionId);
    const msgs = data.messages || [];
    if (!msgs.length){
      container.innerHTML = '<div class="status-msg">Koi messages nahi mile.</div>';
      return;
    }
    container.innerHTML = '';
    msgs.forEach(m => {
      const line = document.createElement('div');
      line.className = 't-line ' + (m.role === 'user' ? 'user' : 'model');
      const tag = document.createElement('span');
      tag.className = 't-tag';
      tag.textContent = m.role === 'user' ? 'Tum:' : 'Bolo:';
      line.appendChild(tag);
      line.appendChild(document.createTextNode(m.content));
      container.appendChild(line);
    });

    const resumeBtn = document.createElement('button');
    resumeBtn.className = 'resume-btn';
    resumeBtn.textContent = 'Isi chat ko resume karo';
    resumeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      window.location.href = 'chat.html?resume=' + sessionId;
    });
    container.appendChild(resumeBtn);
  } catch (err) {
    container.innerHTML = `<div class="status-msg err">Load nahi ho paya: ${err.message}</div>`;
  }
}

(async () => {
  try {
    const data = await apiFetch('/chat/sessions');
    const sessions = data.sessions || [];

    if (!sessions.length){
      listMsg.style.display = 'none';
      sessionList.innerHTML = '<div class="empty-state">Abhi tak koi chat history nahi hai.<br>Pehli practice session shuru karo!</div>';
      return;
    }

    listMsg.style.display = 'none';

    sessions.forEach(s => {
      const card = document.createElement('div');
      card.className = 'session-card';

      const top = document.createElement('div');
      top.className = 'session-top';
      top.innerHTML = `
        <div>
          <div class="session-date">${formatDate(s.started_at)}</div>
          <div class="session-meta">${formatDuration(s.started_at, s.ended_at)} · ${s.turn_count} turns</div>
        </div>
        <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`;

      const transcriptBox = document.createElement('div');
      transcriptBox.className = 'session-transcript';

      let loaded = false;
      card.addEventListener('click', () => {
        const willOpen = !card.classList.contains('open');
        card.classList.toggle('open');
        if (willOpen && !loaded){
          loaded = true;
          loadTranscript(s.id, transcriptBox);
        }
      });

      card.appendChild(top);
      card.appendChild(transcriptBox);
      sessionList.appendChild(card);
    });
  } catch (err) {
    listMsg.className = 'status-msg err';
    listMsg.textContent = 'History load nahi ho payi: ' + err.message;
  }
})();
</script>
</body>
</html>
