<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utkio — Settings</title>
<link rel="stylesheet" href="shared/style.css">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="icon-btn" href="chat.html" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </a>
    <h1 class="app-title" style="font-size:1.2rem;">Settings</h1>
    <span style="width:38px;"></span>
  </header>

  <div class="card" style="margin-top:16px;">
    <label for="apiKey">Google Gemini API key</label>
    <input type="password" id="apiKey" placeholder="AIza..." autocomplete="off">
    <p class="hint">
      Key sirf tumhare phone/device mein save hoti hai (kisi server pe nahi) — agli baar app khologe to dobara daalni nahi padegi. Direct Google ko jaati hai connection ke waqt.
      Free key <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a> se milegi (credit card nahi chahiye).
    </p>
    <div class="status-msg ok" id="savedMsg" style="min-height:1.2em;"></div>
  </div>
</div>

<script type="module">
const API_KEY_STORAGE_KEY = 'utkio_gemini_api_key';
const apiKeyInput = document.getElementById('apiKey');
const savedMsg = document.getElementById('savedMsg');

try {
  const savedKey = localStorage.getItem(API_KEY_STORAGE_KEY);
  if (savedKey) apiKeyInput.value = savedKey;
} catch (e) { console.warn('localStorage read failed', e); }

let saveTimer = null;
apiKeyInput.addEventListener('input', () => {
  try {
    const v = apiKeyInput.value.trim();
    if (v) localStorage.setItem(API_KEY_STORAGE_KEY, v);
    else localStorage.removeItem(API_KEY_STORAGE_KEY);

    savedMsg.textContent = 'Saved';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { savedMsg.textContent = ''; }, 1200);
  } catch (e) { console.warn('localStorage write failed', e); }
});
</script>
</body>
</html>
